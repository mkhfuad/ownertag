<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>OwnerTag — Halter erreichen</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/flow.css">
</head>
<body>
<main class="col">
  <a class="brand" href="/"><svg viewBox="0 0 136 146" aria-hidden="true"><path d="M54 4 L104 20 V80 C104 116 82 136 54 146 C26 136 4 116 4 80 V20 Z" fill="#13294B" stroke="#5E8FE6" stroke-width="7"/><path d="M28 96 C24 96 22 93 22 90 C22 84 26 80 33 78 L44 75 L54 62 C59 55 66 51 75 51 L84 51 C90 51 95 54 99 60 L104 70 C110 72 114 76 114 82 C114 88 110 92 104 92 Z" fill="#9BA3B2" transform="translate(-8,-2) scale(0.92)"/><circle cx="36" cy="92" r="7" fill="none" stroke="#DCE1E6" stroke-width="5"/><circle cx="74" cy="92" r="7" fill="none" stroke="#DCE1E6" stroke-width="5"/></svg> <span>Owner<span class="tag">Tag</span></span></a>

  <div id="loading" role="status">Lade…</div>

  <section id="inactive" class="hidden">
    <h1 id="inactiveTitle">Tag nicht aktiv</h1>
    <p class="sub" id="inactiveText"></p>
    <button class="btn hidden" id="activateBtn" data-de="Diesen Tag aktivieren" data-en="Activate this tag">Diesen Tag aktivieren</button>
  </section>

  <section id="composer" class="hidden">
    <h1 id="tplQ" data-de="Was ist mit dem Fahrzeug?" data-en="What's wrong with the vehicle?">Was ist mit dem Fahrzeug?</h1>
    <p class="sub" data-de="Der Halter wird sofort benachrichtigt. Ihre Nummer sieht er nicht."
       data-en="The owner is notified right away. They never see your number.">Der Halter wird sofort benachrichtigt. Ihre Nummer sieht er nicht.</p>

    <div id="templates" class="opts" role="group" aria-labelledby="tplQ"></div>
    <button type="button" class="link" id="moreBtn" aria-expanded="false" aria-controls="templatesMore" data-de="Etwas anderes" data-en="Something else">Etwas anderes</button>
    <div id="templatesMore" class="opts hidden" role="group" aria-labelledby="tplQ"></div>

    <details>
      <summary data-de="Nachricht hinzufügen (optional)" data-en="Add a message (optional)">Nachricht hinzufügen (optional)</summary>
      <label for="note" data-de="Kurze Nachricht (keine Links oder Nummern)" data-en="Short message (no links or numbers)">Kurze Nachricht</label>
      <textarea id="note" rows="2" maxlength="200"></textarea>
      <label for="callback" data-de="Ihre Nummer für eine Antwort per SMS (bleibt verborgen)" data-en="Your number for a reply by SMS (stays hidden)">Ihre Nummer für eine Antwort</label>
      <input id="callback" type="tel" inputmode="tel" autocomplete="tel" placeholder="+49 …">
    </details>

    <div id="ts-widget"></div>
    <button type="button" class="btn" id="sendBtn" data-de="Senden" data-en="Send">Senden</button>
    <p class="inline err" id="formErr" role="alert"></p>
    <p class="inline ok" id="formOk" role="status"></p>

    <button type="button" class="link" id="callBtn" aria-expanded="false" aria-controls="callPanel" data-de="Lieber anrufen" data-en="Call instead">Lieber anrufen</button>
    <div id="callPanel" class="hidden">
      <label for="callPhone" data-de="Ihre Nummer. Wir rufen Sie an und verbinden Sie. Der Halter sieht sie nicht."
             data-en="Your number. We call you and connect you. The owner never sees it.">Ihre Nummer</label>
      <input id="callPhone" type="tel" inputmode="tel" autocomplete="tel" value="+49">
      <button type="button" class="btn" id="callGo" data-de="Jetzt verbinden" data-en="Connect now">Jetzt verbinden</button>
    </div>
    <p class="fine" id="tagChip" style="margin-top:8px"></p>
  </section>

  <section id="done" class="hidden">
    <h1 data-de="Gesendet." data-en="Sent.">Gesendet.</h1>
    <p class="sub" data-de="Der Halter wurde benachrichtigt. Ihre Nummer wurde nicht geteilt. Antwortet der Halter, erscheint es hier."
       data-en="The owner has been notified. Your number was not shared. If the owner replies, it appears here.">Der Halter wurde benachrichtigt.</p>
    <div id="inbox" aria-live="polite"></div>
  </section>

  <section id="error" class="hidden" role="alert">
    <h1 data-de="Das hat nicht geklappt." data-en="That didn't work.">Das hat nicht geklappt.</h1>
    <p class="sub" id="errorText"></p>
    <button type="button" class="btn" id="retryBtn" data-de="Erneut versuchen" data-en="Try again">Erneut versuchen</button>
  </section>

  <p class="foot"><a href="/impressum">Impressum</a><a href="/datenschutz">Datenschutz</a></p>
</main>
<script src="/scan.js"></script>
</body>
</html>
