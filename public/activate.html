<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>OwnerTag — Aktivierung</title>
<link rel="stylesheet" href="/ot.css">
</head>
<body>
<div class="card">
  <div class="brand"><svg viewBox="0 0 136 146" style="height:1.5em;width:1.4em;vertical-align:-0.3em" aria-hidden="true"><path d="M54 4 L104 20 V80 C104 116 82 136 54 146 C26 136 4 116 4 80 V20 Z" fill="#13294B" stroke="#5E8FE6" stroke-width="6"/><path d="M28 96 C24 96 22 93 22 90 C22 84 26 80 33 78 L44 75 L54 62 C59 55 66 51 75 51 L84 51 C90 51 95 54 99 60 L104 70 C110 72 114 76 114 82 C114 88 110 92 104 92 Z" fill="#9BA3B2" transform="translate(-8,-2) scale(0.92)"/><circle cx="36" cy="92" r="7" fill="none" stroke="#DCE1E6" stroke-width="5"/><circle cx="74" cy="92" r="7" fill="none" stroke="#DCE1E6" stroke-width="5"/><g fill="none" stroke="#5E8FE6" stroke-width="6" stroke-linecap="round"><path d="M112 26 A18 18 0 0 1 126 44" opacity=".95"/><path d="M108 10 A34 34 0 0 1 130 44" opacity=".45"/></g></svg> <span>Owner<span class="tag">Tag</span></span></div>
  <h1>Tag aktivieren / Activate tag</h1>
  <p class="sub">Ihre Nummer wird verschlüsselt gespeichert und niemals angezeigt.<br>
  Your number is stored encrypted and never displayed.</p>

  <div class="panel" id="step1">
    <label>Mobilnummer / Mobile number</label>
    <input id="phone" type="tel" placeholder="+49 151 …">
    <button class="btn" id="otpBtn">Code senden / Send code</button>
  </div>

  <div class="panel hidden" id="step2">
    <label>SMS-Code</label>
    <input id="code" inputmode="numeric" maxlength="6" placeholder="123456">
    <label>Kennzeichen (optional) / Plate (optional)</label>
    <input id="plate" placeholder="B-XX 1234">
    <label>Fahrzeugtyp / Vehicle type</label>
    <div class="row">
      <button class="tpl sel" data-type="car">🚗 Auto</button>
      <button class="tpl" data-type="bike">🏍 Motorrad</button>
    </div>
    <label>E-Mail (optional, als Benachrichtigungskanal)</label>
    <input id="email" type="email" placeholder="you@example.com">
    <button class="btn" id="verifyBtn">Aktivieren / Activate</button>
  </div>

  <div class="panel hidden" id="done" style="text-align:center">
    <svg viewBox="0 0 108 146" style="width:64px;height:86px;margin-bottom:10px" aria-hidden="true">
      <style>
        .draw { stroke-dasharray: 460; stroke-dashoffset: 460; animation: ot-draw .9s cubic-bezier(.25,.1,.25,1) forwards; }
        @keyframes ot-draw { to { stroke-dashoffset: 0; } }
        @media (prefers-reduced-motion: reduce) { .draw { animation: none; stroke-dashoffset: 0; } }
      </style>
      <path class="draw" d="M54 4 L104 20 V80 C104 116 82 136 54 146 C26 136 4 116 4 80 V20 Z"
            fill="none" stroke="#5E8FE6" stroke-width="6"/>
      <path class="draw" style="animation-delay:.5s" d="M32 78 L48 94 L78 56"
            fill="none" stroke="#67d29a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1 class="ok">✓ Aktiviert / Activated</h1>
    <p class="sub">Ihr Tag ist live. Einstellungen &amp; Antworten: <a href="/owner" style="color:var(--accent)">Dashboard</a></p>
  </div>
  <p class="note" id="status"></p>
</div>

<script src="/activate.js"></script>
</body>
</html>
