name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: for f in src/*.js scripts/*.js test/*.js; do node --check "$f"; done
      - name: Self-checks (crypto, tokens, moderation)
        run: npm test
