services:
  api:
    build: .
    ports: ["8080:8080"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://ownertag:ownertag@db:5432/ownertag
      REDIS_URL: redis://redis:6379
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
  db:
    image: postgres:16-alpine
    # Not published to the host — the app reaches it privately over the Docker
    # network. Publishing 5432 both risks a port clash and exposes Postgres.
    # (For local dev where you run `npm start` on the host, add: ports: ["5432:5432"])
    environment:
      POSTGRES_USER: ownertag
      POSTGRES_PASSWORD: ownertag
      POSTGRES_DB: ownertag
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ownertag"]
      interval: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    # Internal only (no host port) — reachable by the app over the Docker network.
volumes:
  pgdata:
