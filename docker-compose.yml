services:
  api:
    build: .
    # Loopback only. Compose CONCATENATES port lists across files, so the prod
    # overlay's `ports: []` can't remove a public binding — and Docker's iptables
    # rules bypass UFW. 127.0.0.1 keeps local dev working while :8080 is never
    # reachable from the internet (where it would skip Caddy's TLS and let callers
    # forge X-Forwarded-For, i.e. defeat the IP rate limits).
    ports: ["127.0.0.1:8080:8080"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://ownertag:ownertag@db:5432/ownertag
      REDIS_URL: redis://redis:6379
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
  db:
    image: postgres:16-alpine
    # Not published to the host — the app reaches it privately over the Docker
    # network. Publishing 5432 both risks a port clash and exposes Postgres.
    # (For local dev where you run `npm start` on the host, add: ports: ["5432:5432"])
    environment:
      POSTGRES_USER: ownertag
      POSTGRES_PASSWORD: ownertag
      POSTGRES_DB: ownertag
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ownertag"]
      interval: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    # Internal only (no host port) — reachable by the app over the Docker network.
volumes:
  pgdata:
