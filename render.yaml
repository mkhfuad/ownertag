# Render Blueprint — deploys the whole OwnerTag stack in Frankfurt (EU).
# In Render: New + → Blueprint → pick this repo → Apply.
services:
  - type: web
    name: ownertag
    runtime: docker
    region: frankfurt
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        value: https://ownertag.onrender.com   # update after adding your own domain
      - key: DATABASE_URL
        fromDatabase:
          name: ownertag-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ownertag-redis
          property: connectionString
      - key: MASTER_KEY
        generateValue: true
      - key: HMAC_KEY
        generateValue: true
      - key: TOKEN_KEY
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      # Fill these in the Render dashboard when you have the accounts:
      - key: TURNSTILE_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_RELAY_NUMBERS
        sync: false
      - key: TWILIO_SMS_SENDER
        value: OWNERTAG
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_ACCESS_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: "OwnerTag <no-reply@ownertag.de>"
      - key: ORDER_NOTIFY_EMAIL
        sync: false

  - type: keyvalue
    name: ownertag-redis
    region: frankfurt
    plan: free
    ipAllowList: []          # only reachable from inside Render

databases:
  - name: ownertag-db
    region: frankfurt
    plan: basic-256mb
