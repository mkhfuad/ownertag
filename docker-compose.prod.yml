# Production overlay for a single VPS (Hostinger KVM 1, etc.).
# Run:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# What it changes vs. the dev compose:
#   - Puts Caddy in front for automatic HTTPS (ports 80/443).
#   - Stops publishing Postgres (5432) and Redis (6379) to the host, so they
#     are reachable only on the internal Docker network — never the internet.
#     (Redis has no password; an open 6379 is a well-known way to get owned.)
#   - Restarts everything automatically after a crash or VPS reboot.
services:
  api:
    ports: []                 # not public; Caddy reaches it over the internal network
    restart: unless-stopped
  db:
    ports: []                 # internal only — never expose Postgres publicly
    restart: unless-stopped
  redis:
    ports: []                 # internal only — Redis has no auth; must stay private
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
volumes:
  caddy_data:
  caddy_config:
